<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4338ca">
<link rel="manifest" href="manifest.json">
<title>NEET PCB 30-Day Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#eef2ff,#ecfeff,#fdf2f8);color:#172033}
.wrap{max-width:760px;margin:auto;padding:15px}h1{color:#312e81;margin:4px 0}.sub{color:#64748b;font-size:13px;margin-bottom:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:14px;margin:10px 0;box-shadow:0 5px 16px #1e293b0d}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:11px;border-radius:13px;background:#f8fafc;text-align:center}.stat b{display:block;font-size:20px;color:#312e81}
.progress{height:11px;background:#e2e8f0;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4f46e5,#06b6d4);width:0}
.day{border:1px solid #e2e8f0;border-radius:14px;margin:9px 0;overflow:hidden;background:#fff}.dayhead{padding:11px 12px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center}
.dayhead.done{background:#dcfce7;color:#166534}.subject{padding:11px 12px;border-top:1px solid #eef2f7;display:grid;grid-template-columns:105px 1fr 34px;gap:8px;align-items:center}
.subject.physics{border-left:5px solid #4f46e5}.subject.chemistry{border-left:5px solid #f97316}.subject.biology{border-left:5px solid #16a34a}
input[type=number]{width:100%;padding:9px;border:1px solid #dbe2f0;border-radius:9px;font-size:16px}.check{width:23px;height:23px;accent-color:#16a34a}
button{border:1px solid #dbe2f0;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;color:#334155}.danger{background:#fff1f2;color:#be123c;border-color:#fecaca}
.note{font-size:12px;color:#64748b;margin-top:8px}
@media(max-width:520px){.summary{grid-template-columns:1fr 1fr 1fr}.subject{grid-template-columns:90px 1fr 32px}}
</style>
</head>
<body>
<main class="wrap">
<h1>NEET PCB 30-Day Tracker</h1>
<div class="sub">150 questions every day • 50 Physics + 50 Chemistry + 50 Biology</div>

<div class="card">
<div class="summary">
<div class="stat"><span>Questions</span><b id="total">0 / 4500</b></div>
<div class="stat"><span>Days complete</span><b id="days">0 / 30</b></div>
<div class="stat"><span>Progress</span><b id="pct">0%</b></div>
</div>
<div style="margin-top:12px" class="progress"><div id="bar" class="fill"></div></div>
<div class="note">Enter the number completed for each subject. When it reaches <b>50/50</b>, that subject turns green and is marked complete.</div>
</div>

<div id="daysList"></div>

<div class="card">
<button class="danger" id="reset">Reset all 30 days</button>
<div class="note">This reset affects only this tracker.</div>
</div>
</main>
<script>
const KEY="neet-pcb-30-v2";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||Array.from({length:30},()=>[0,0,0]);
const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};
const clamp=n=>Math.max(0,Math.min(50,Number(n)||0));
function render(){
 let total=data.flat().reduce((a,b)=>a+b,0);
 let full=data.filter(d=>d.every(x=>x===50)).length;
 document.getElementById("total").textContent=`${total} / 4500`;
 document.getElementById("days").textContent=`${full} / 30`;
 let pct=Math.round(total/4500*100);
 document.getElementById("pct").textContent=pct+"%";
 document.getElementById("bar").style.width=pct+"%";
 document.getElementById("daysList").innerHTML=data.map((d,i)=>{
   const done=d.every(x=>x===50);
   return `<div class="day">
   <div class="dayhead ${done?"done":""}"><b>Day ${i+1}</b><span>${done?"✓ Complete":"0–150 questions"}</span></div>
   ${["Physics","Chemistry","Biology"].map((s,j)=>{
      let v=d[j], cls=s.toLowerCase(), complete=v===50;
      return `<div class="subject ${cls}" style="${complete?"background:#dcfce7":""}">
        <b>${s}</b>
        <input aria-label="${s} questions for Day ${i+1}" type="number" min="0" max="50" value="${v}" data-day="${i}" data-sub="${j}">
        <input class="check" type="checkbox" ${complete?"checked":""} data-check="${i}" data-sub="${j}" title="50 completed">
      </div>`;
   }).join("")}
   </div>`;
 }).join("");
}
document.getElementById("daysList").addEventListener("input",e=>{
 if(e.target.dataset.day!==undefined){data[+e.target.dataset.day][+e.target.dataset.sub]=clamp(e.target.value);save()}
});
document.getElementById("daysList").addEventListener("change",e=>{
 if(e.target.dataset.check!==undefined){
   const d=+e.target.dataset.check,s=+e.target.dataset.sub;
   data[d][s]=e.target.checked?50:0;save();
 }
});
document.getElementById("reset").onclick=()=>{
 if(confirm("Reset all 30 days? This will erase the question counts in this tracker.")){
   data=Array.from({length:30},()=>[0,0,0]);save();
 }
};
render();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script>
</body></html>
